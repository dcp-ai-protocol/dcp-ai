            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        run: npm publish --access public --ignore-scripts
        env:
          # Transitional fallback: npm tries trusted publishing (OIDC) first. Delete this
          # env block, and the NPM_TOKEN secret, once the trusted publishers are verified.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-express:
    name: Build @dcp-ai/express
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.package == 'all' || github.event.inputs.package == 'express'
    # Read-only: this job installs dependencies and runs build scripts, so it never
    # gets `id-token: write`. It hands a packed tarball to publish-express.
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    defaults:
      run:
        working-directory: integrations/express
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Check if version already published
        id: check
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          REMOTE=$(npm view @dcp-ai/express@$LOCAL version 2>/dev/null || true)
          if [ -n "$REMOTE" ]; then
            echo "@dcp-ai/express@$LOCAL is already on npm — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        name: Install against the published @dcp-ai/sdk
        run: npm install --no-package-lock
      - if: steps.check.outputs.skip != 'true'
        run: npm run build
      - if: steps.check.outputs.skip != 'true'
        name: Pack the tarball
        run: npm pack --pack-destination "$RUNNER_TEMP/pkg"
      - if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: npm-express
          path: ${{ runner.temp }}/pkg/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish-express:
    name: Publish @dcp-ai/express
    needs: build-express
    runs-on: ubuntu-latest
    if: needs.build-express.result == 'success' && needs.build-express.outputs.skip != 'true'
    # Only downloads the tarball built above and publishes it: no checkout, no install,
    # no package script, so no third-party code can use the OIDC token.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-express
          path: pkg
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm publish ./pkg/*.tgz --access public --ignore-scripts
        env:
          # Transitional fallback: npm tries trusted publishing (OIDC) first. Delete this
          # env block, and the NPM_TOKEN secret, once the trusted publishers are verified.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-openclaw:
    name: Build @dcp-ai/openclaw
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.package == 'all' || github.event.inputs.package == 'openclaw'
    # Read-only: this job installs dependencies and runs build scripts, so it never
    # gets `id-token: write`. It hands a packed tarball to publish-openclaw.
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    defaults:
      run:
        working-directory: integrations/openclaw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Check if version already published
        id: check
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          REMOTE=$(npm view @dcp-ai/openclaw@$LOCAL version 2>/dev/null || true)
          if [ -n "$REMOTE" ]; then
            echo "@dcp-ai/openclaw@$LOCAL is already on npm — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        name: Install against the published @dcp-ai/sdk
        run: npm install --no-package-lock
      - if: steps.check.outputs.skip != 'true'
        run: npm run build
      - if: steps.check.outputs.skip != 'true'
        name: Pack the tarball
        run: npm pack --pack-destination "$RUNNER_TEMP/pkg"
      - if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: npm-openclaw
          path: ${{ runner.temp }}/pkg/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish-openclaw:
    name: Publish @dcp-ai/openclaw
    needs: build-openclaw
    runs-on: ubuntu-latest
    if: needs.build-openclaw.result == 'success' && needs.build-openclaw.outputs.skip != 'true'
    # Only downloads the tarball built above and publishes it: no checkout, no install,
    # no package script, so no third-party code can use the OIDC token.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-openclaw
