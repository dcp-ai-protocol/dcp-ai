name: Publish Integrations

# Publishes the 6 framework integrations to npm. Each is its own
# package under the @dcp-ai scope and is independent of the others.
# Every job pre-checks whether the manifest version is already on npm
# and, if so, exits green with a skip notice. That keeps the Actions
# tab free of red ghosts when a release only bumps one integration.
#
# npm authentication is trusted publishing (OIDC); NPM_TOKEN stays only as a
# transitional fallback. Packages with nothing to build are published straight from
# the checkout with `--ignore-scripts`. express and openclaw need an install and a
# build, so they are built and packed in a read-only build-* job and published by a
# separate publish-* job that only downloads the tarball (see publish.yml for why).
# Trusted publishers are configured per package on npmjs.com with the workflow
# filename `publish-integrations.yml`.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: 'Integration to publish'
        required: true
        type: choice
        options:
          - all
          - anthropic-mcp
          - autogen
          - google-a2a
          - w3c-did
          - express
          - openclaw

permissions:
  contents: read

jobs:
  publish-anthropic-mcp:
    name: Publish @dcp-ai/anthropic-mcp
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.package == 'all' || github.event.inputs.package == 'anthropic-mcp'
    # Nothing is installed and no package script runs here, so no third-party code
    # can use the OIDC token this job is allowed to mint.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: integrations/anthropic-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Check if version already published
        id: check
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          REMOTE=$(npm view @dcp-ai/anthropic-mcp@$LOCAL version 2>/dev/null || true)
          if [ -n "$REMOTE" ]; then
            echo "@dcp-ai/anthropic-mcp@$LOCAL is already on npm — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        run: npm publish --access public --ignore-scripts
        env:
          # Transitional fallback: npm tries trusted publishing (OIDC) first. Delete this
          # env block, and the NPM_TOKEN secret, once the trusted publishers are verified.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-autogen:
    name: Publish @dcp-ai/autogen
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.package == 'all' || github.event.inputs.package == 'autogen'
    # Nothing is installed and no package script runs here, so no third-party code
    # can use the OIDC token this job is allowed to mint.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: integrations/autogen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Check if version already published
        id: check
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          REMOTE=$(npm view @dcp-ai/autogen@$LOCAL version 2>/dev/null || true)
          if [ -n "$REMOTE" ]; then
            echo "@dcp-ai/autogen@$LOCAL is already on npm — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        run: npm publish --access public --ignore-scripts
        env:
          # Transitional fallback: npm tries trusted publishing (OIDC) first. Delete this
          # env block, and the NPM_TOKEN secret, once the trusted publishers are verified.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-google-a2a:
    name: Publish @dcp-ai/google-a2a
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.package == 'all' || github.event.inputs.package == 'google-a2a'
    # Nothing is installed and no package script runs here, so no third-party code
    # can use the OIDC token this job is allowed to mint.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: integrations/google-a2a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
