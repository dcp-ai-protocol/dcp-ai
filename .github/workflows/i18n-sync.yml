name: Documentation and i18n

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'mkdocs.yml'
      - 'scripts/build-docs-site.sh'
      - 'scripts/docs*'
      - 'scripts/test_docs*'
      - '.github/workflows/docs.yml'
      - '.github/workflows/i18n-sync.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'mkdocs.yml'
      - 'scripts/build-docs-site.sh'
      - 'scripts/docs*'
      - 'scripts/test_docs*'
      - '.github/workflows/docs.yml'
      - '.github/workflows/i18n-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    name: Complete documentation and translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing documentation toolchain
        run: pip install 'mkdocs==1.6.*' 'mkdocs-material==9.5.*' 'pymdown-extensions==10.*'
      - name: Test positive and negative gate controls
        run: python3 -m unittest discover -s scripts -p 'test_docs*.py' -v
      - name: Check coverage, reviewed hashes, structure and links
        run: python3 scripts/docs_i18n.py check
      - name: Build and validate all five languages
        run: bash scripts/build-docs-site.sh
