name: Publish Packages

# Publishes the core SDK packages (TypeScript, WASM, CLI, Rust).
# Every job pre-checks whether the manifest version is already on the
# registry; if it is, the job prints a skip notice and exits green.
# That way releases that only bump one package (e.g. the Python SDK
# at v2.0.1) don't leave red ghosts in the Actions tab.
#
# npm authentication: the publish jobs let npm use trusted publishing (OIDC). That needs
# npm >= 11.5.1 (they set up Node 24) and, on npmjs.com, a trusted publisher per package
# with the workflow filename `publish.yml`. That configuration is outside this repository
# and no publish has gone through OIDC yet. NPM_TOKEN stays as the fallback: npm uses it
# when the exchange is refused, and such a publish carries no provenance statement.
# crates.io still uses a token.
#
# A job that holds `id-token: write` can mint a publish credential for every package
# configured for this workflow file, so no such job installs dependencies or runs package
# scripts: each npm package is built and packed in a read-only build-* job, and a separate
# publish-* job downloads the tarball, checks that it is the file its build job packed
# (SHA-256) and that npm reads the expected name and version from it, and runs
# `npm publish --ignore-scripts`.
#
# Merging a change to this file publishes nothing: it runs only for a published GitHub
# Release or a manual dispatch.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - all
          - sdk-typescript
          - sdk-wasm
          - cli
          - sdk-rust

# Jobs that need more than read-only declare it themselves.
permissions:
  contents: read

jobs:
  build-typescript-sdk:
    name: Build @dcp-ai/sdk
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.package == 'all' || github.event.inputs.package == 'sdk-typescript'
    # Read-only: this job installs dependencies and runs build scripts, so it never
    # gets `id-token: write`. It hands a packed tarball to publish-typescript-sdk.
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      version: ${{ steps.check.outputs.version }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Check if version already published
        id: check
        # Fails closed: only a registry answer that this version exists, or that it does not, lets the
        # job go on. First-party script without dependencies; it reads the name from ./package.json.
        run: node "$GITHUB_WORKSPACE/tools/publish/npm-version-check.mjs"
      - if: steps.check.outputs.skip != 'true'
        name: Install
        run: npm ci
      - if: steps.check.outputs.skip != 'true'
        run: npm run lint
      - if: steps.check.outputs.skip != 'true'
        run: npm run test
      - if: steps.check.outputs.skip != 'true'
        run: npm run build
      - if: steps.check.outputs.skip != 'true'
        name: Pack the tarball
        id: pack
        # npm does not create the destination. The hash lets the publish job check it got this file.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pkg"
          npm pack --pack-destination "$RUNNER_TEMP/pkg"
          echo "sha256=$(sha256sum "$RUNNER_TEMP"/pkg/*.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: npm-typescript-sdk
          path: ${{ runner.temp }}/pkg/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish-typescript-sdk:
    name: Publish @dcp-ai/sdk to NPM
    needs: build-typescript-sdk
    runs-on: ubuntu-latest
    if: needs.build-typescript-sdk.result == 'success' && needs.build-typescript-sdk.outputs.skip != 'true'
    # Only downloads the tarball built above and publishes it: no checkout, no install,
    # no package script, so no third-party code can use the OIDC token.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-typescript-sdk
          path: pkg
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Check the tarball before publishing
        # The build job ran third-party code, and npm publishes whatever package is named inside the
        # tarball. Accept only the file that build job packed, and only if npm reads this package at
        # the version that job checked against the registry. The values arrive through env, so the
        # shell compares them and never evaluates them.
        env:
          EXPECTED_NAME: '@dcp-ai/sdk'
          EXPECTED_VERSION: ${{ needs.build-typescript-sdk.outputs.version }}
          EXPECTED_SHA256: ${{ needs.build-typescript-sdk.outputs.sha256 }}
        run: |
          set -euo pipefail
          files=(./pkg/*.tgz)
          [ "${#files[@]}" -eq 1 ] || { echo "::error::expected one tarball, found ${#files[@]}"; exit 1; }
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the build job reported no SHA-256"; exit 1; }
          [[ "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::the build job reported no version"; exit 1; }
          actual=$(sha256sum "${files[0]}" | cut -d' ' -f1)
          [ "$actual" = "$EXPECTED_SHA256" ] || { echo "::error::the tarball is not the one the build job packed"; exit 1; }
          found=$(npm pack "${files[0]}" --dry-run --json --ignore-scripts | node -p 'const p = JSON.parse(require("fs").readFileSync(0, "utf8"))[0]; p.name + "@" + p.version')
          [ "$found" = "$EXPECTED_NAME@$EXPECTED_VERSION" ] || { echo "::error::the tarball is $found, not $EXPECTED_NAME@$EXPECTED_VERSION"; exit 1; }
      - run: npm publish ./pkg/*.tgz --access public --ignore-scripts
        env:
          # Transitional fallback: npm tries trusted publishing (OIDC) first. Delete this
          # env block, and the NPM_TOKEN secret, once the trusted publishers are verified.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-wasm-sdk:
    name: Build @dcp-ai/wasm
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.package == 'all' || github.event.inputs.package == 'sdk-wasm'
    # Read-only: this job installs dependencies and runs build scripts, so it never
    # gets `id-token: write`. It hands a packed tarball to publish-wasm-sdk.
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      version: ${{ steps.check.outputs.version }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    defaults:
      run:
        working-directory: sdks/wasm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Check if version already published
        id: check
        # Fails closed: only a registry answer that this version exists, or that it does not, lets the
        # job go on. First-party script without dependencies; it reads the name from ./package.json.
        run: node "$GITHUB_WORKSPACE/tools/publish/npm-version-check.mjs"
      - if: steps.check.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.check.outputs.skip != 'true'
        name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - if: steps.check.outputs.skip != 'true'
        run: npm install
      - if: steps.check.outputs.skip != 'true'
        run: npm run build
      - if: steps.check.outputs.skip != 'true'
        name: Pack the tarball
        id: pack
        # npm does not create the destination. The hash lets the publish job check it got this file.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pkg"
          npm pack --pack-destination "$RUNNER_TEMP/pkg"
          echo "sha256=$(sha256sum "$RUNNER_TEMP"/pkg/*.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: npm-wasm-sdk
          path: ${{ runner.temp }}/pkg/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish-wasm-sdk:
    name: Publish @dcp-ai/wasm to NPM
    needs: build-wasm-sdk
    runs-on: ubuntu-latest
    if: needs.build-wasm-sdk.result == 'success' && needs.build-wasm-sdk.outputs.skip != 'true'
    # Only downloads the tarball built above and publishes it: no checkout, no install,
    # no package script, so no third-party code can use the OIDC token.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-wasm-sdk
          path: pkg
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Check the tarball before publishing
        # The build job ran third-party code, and npm publishes whatever package is named inside the
        # tarball. Accept only the file that build job packed, and only if npm reads this package at
        # the version that job checked against the registry. The values arrive through env, so the
        # shell compares them and never evaluates them.
        env:
          EXPECTED_NAME: '@dcp-ai/wasm'
          EXPECTED_VERSION: ${{ needs.build-wasm-sdk.outputs.version }}
          EXPECTED_SHA256: ${{ needs.build-wasm-sdk.outputs.sha256 }}
        run: |
          set -euo pipefail
          files=(./pkg/*.tgz)
          [ "${#files[@]}" -eq 1 ] || { echo "::error::expected one tarball, found ${#files[@]}"; exit 1; }
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the build job reported no SHA-256"; exit 1; }
          [[ "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::the build job reported no version"; exit 1; }
          actual=$(sha256sum "${files[0]}" | cut -d' ' -f1)
          [ "$actual" = "$EXPECTED_SHA256" ] || { echo "::error::the tarball is not the one the build job packed"; exit 1; }
          found=$(npm pack "${files[0]}" --dry-run --json --ignore-scripts | node -p 'const p = JSON.parse(require("fs").readFileSync(0, "utf8"))[0]; p.name + "@" + p.version')
          [ "$found" = "$EXPECTED_NAME@$EXPECTED_VERSION" ] || { echo "::error::the tarball is $found, not $EXPECTED_NAME@$EXPECTED_VERSION"; exit 1; }
      - run: npm publish ./pkg/*.tgz --access public --ignore-scripts
        env:
          # Transitional fallback: npm tries trusted publishing (OIDC) first. Delete this
          # env block, and the NPM_TOKEN secret, once the trusted publishers are verified.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-cli:
    name: Build @dcp-ai/cli
    runs-on: ubuntu-latest
    needs: [build-typescript-sdk, publish-typescript-sdk]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (github.event_name == 'release' || github.event.inputs.package == 'all' || github.event.inputs.package == 'cli') }}
    # Read-only: this job installs dependencies and runs build scripts, so it never
    # gets `id-token: write`. It hands a packed tarball to publish-cli.
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      version: ${{ steps.check.outputs.version }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Check if version already published
        id: check
        # Fails closed: only a registry answer that this version exists, or that it does not, lets the
        # job go on. First-party script without dependencies; it reads the name from ./package.json.
        run: node "$GITHUB_WORKSPACE/tools/publish/npm-version-check.mjs"
      - if: steps.check.outputs.skip != 'true'
        name: Install against the freshly-published SDK
        run: npm install --no-package-lock
      - if: steps.check.outputs.skip != 'true'
        name: Pack the tarball
        id: pack
        # npm does not create the destination. The hash lets the publish job check it got this file.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pkg"
          npm pack --pack-destination "$RUNNER_TEMP/pkg"
          echo "sha256=$(sha256sum "$RUNNER_TEMP"/pkg/*.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: npm-cli
          path: ${{ runner.temp }}/pkg/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish-cli:
    name: Publish @dcp-ai/cli to NPM
    needs: build-cli
    runs-on: ubuntu-latest
    # `!cancelled()` is needed: publish-typescript-sdk is an ancestor through build-cli, and it is skipped
    # when the SDK is already on npm or was not selected. Without a status function this job would be
    # skipped with it, and the CLI would never be published on its own.
    if: ${{ !cancelled() && needs.build-cli.result == 'success' && needs.build-cli.outputs.skip != 'true' }}
    # Only downloads the tarball built above and publishes it: no checkout, no install,
    # no package script, so no third-party code can use the OIDC token.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-cli
          path: pkg
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Check the tarball before publishing
        # The build job ran third-party code, and npm publishes whatever package is named inside the
        # tarball. Accept only the file that build job packed, and only if npm reads this package at
        # the version that job checked against the registry. The values arrive through env, so the
        # shell compares them and never evaluates them.
        env:
          EXPECTED_NAME: '@dcp-ai/cli'
          EXPECTED_VERSION: ${{ needs.build-cli.outputs.version }}
          EXPECTED_SHA256: ${{ needs.build-cli.outputs.sha256 }}
        run: |
          set -euo pipefail
          files=(./pkg/*.tgz)
          [ "${#files[@]}" -eq 1 ] || { echo "::error::expected one tarball, found ${#files[@]}"; exit 1; }
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the build job reported no SHA-256"; exit 1; }
          [[ "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::the build job reported no version"; exit 1; }
          actual=$(sha256sum "${files[0]}" | cut -d' ' -f1)
          [ "$actual" = "$EXPECTED_SHA256" ] || { echo "::error::the tarball is not the one the build job packed"; exit 1; }
          found=$(npm pack "${files[0]}" --dry-run --json --ignore-scripts | node -p 'const p = JSON.parse(require("fs").readFileSync(0, "utf8"))[0]; p.name + "@" + p.version')
          [ "$found" = "$EXPECTED_NAME@$EXPECTED_VERSION" ] || { echo "::error::the tarball is $found, not $EXPECTED_NAME@$EXPECTED_VERSION"; exit 1; }
      - run: npm publish ./pkg/*.tgz --access public --ignore-scripts
        env:
          # Transitional fallback: npm tries trusted publishing (OIDC) first. Delete this
          # env block, and the NPM_TOKEN secret, once the trusted publishers are verified.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-rust-sdk:
    name: Publish dcp-ai to crates.io
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.package == 'all' || github.event.inputs.package == 'sdk-rust'
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check if version already published
        id: check
        # Only a valid index of this existing crate can confirm version absence.
        # Errors, including 403/404/429/5xx, never enable publication.
        run: python3 "$GITHUB_WORKSPACE/tools/publish/crates-version-check.py"
      - if: steps.check.outputs.skip == 'false'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.check.outputs.skip == 'false'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
