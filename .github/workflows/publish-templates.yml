name: Publish Templates

# Publishes the four @dcp-ai/create-* scaffold packages to npm.
# Each package is independent and ships:
#   bin.js  — Node script that copies a template/ directory into CWD
#   template/ — the starter files for that framework
#
# As with publish-integrations.yml, every job pre-checks the registry
# and skips publish if the manifest version is already on npm.
#
# npm authentication: as in publish.yml, the jobs let npm use trusted publishing (OIDC)
# and NPM_TOKEN stays as the fallback; no publish has gone through OIDC yet. The trusted
# publishers are configured per package on npmjs.com with the workflow filename
# `publish-templates.yml`. The packages have nothing to install or build, so each job
# publishes the checked-out files with `--ignore-scripts` and no third-party code runs
# next to the OIDC token. Merging a change to this file publishes nothing: it runs only
# for a published GitHub Release or a manual dispatch.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: 'Template to publish'
        required: true
        type: choice
        options:
          - all
          - create-langchain
          - create-crewai
          - create-openai
          - create-express

permissions:
  contents: read

jobs:
  publish-create-langchain:
    name: Publish @dcp-ai/create-langchain
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.package == 'all' || github.event.inputs.package == 'create-langchain'
    # Nothing is installed and no package script runs here, so no third-party code
    # can use the OIDC token this job is allowed to mint.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/create-langchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Check if version already published
        id: check
        # Fails closed: only a registry answer that this version exists, or that it does not, lets the
        # job go on. First-party script without dependencies; it reads the name from ./package.json.
        run: node "$GITHUB_WORKSPACE/tools/publish/npm-version-check.mjs"
      - if: steps.check.outputs.skip != 'true'
        run: npm publish --access public --ignore-scripts
        env:
          # Transitional fallback: npm tries trusted publishing (OIDC) first. Delete this
          # env block, and the NPM_TOKEN secret, once the trusted publishers are verified.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-create-crewai:
    name: Publish @dcp-ai/create-crewai
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.package == 'all' || github.event.inputs.package == 'create-crewai'
