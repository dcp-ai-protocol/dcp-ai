# Design model of the non-normative dcp-jcs-v2 canonicalization candidate (tools/canonicalization-lab).
# Regenerates the corpus and compares it byte for byte, runs the 274 cases and the 24 negative
# controls. It checks the model only: it is not SDK conformance, and dcp-jcs-v1 does not change.

name: Canonicalization lab

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/canonicalization-lab.yml'
      - 'tools/canonicalization-lab/**'
      - 'docs/proposals/canonicalization-candidate/**'
  pull_request:
    paths:
      - '.github/workflows/canonicalization-lab.yml'
      - 'tools/canonicalization-lab/**'
      - 'docs/proposals/canonicalization-candidate/**'

permissions:
  contents: read

# A newer run of the same pull request cancels the older one; runs on main never cancel each other.
concurrency:
  group: canonicalization-lab-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  model:
    name: Model (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']  # the documented minimum and a current version; standard library only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: New output directory
        run: |
          python --version
          lab_out="$(mktemp -d "$RUNNER_TEMP/canonicalization-lab.XXXXXX")"
          printf 'LAB_OUT=%s\n' "$lab_out" >> "$GITHUB_ENV"

      - name: Regenerate the corpus and compare it byte for byte
        run: |
          python -I tools/canonicalization-lab/generate_corpus.py "$LAB_OUT/corpus.json"
          cmp "$LAB_OUT/corpus.json" docs/proposals/canonicalization-candidate/corpus.json

      - name: Run the corpus
        run: python tools/canonicalization-lab/run.py --out "$LAB_OUT/run.json"

      - name: Run the negative controls
        run: python tools/canonicalization-lab/run.py --controls --out "$LAB_OUT/controls.json"

      # The runner exits non-zero on any failure; this also fails if cases or controls go missing.
      - name: Check the counts
        run: |
          python -I - "$LAB_OUT/run.json" "$LAB_OUT/controls.json" <<'EOF'
          import json, sys
          run = json.load(open(sys.argv[1]))
          controls = json.load(open(sys.argv[2]))['controls']
          assert run['total'] == run['passed'] == 274 and not run['mismatches'] and not run['invalid_results'], run['total']
          assert len(controls) == 24 and all(c['caught'] for c in controls.values()), len(controls)
          print(f"{run['passed']}/{run['total']} cases, {len(controls)} controls caught")
          EOF
