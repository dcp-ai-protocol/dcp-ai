name: Deploy Docs

# Validate and build the complete five-language manifest, then deploy Pages.
# SDK/integration/contributor Markdown is included, not just docs/ and spec/.

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'mkdocs.yml'
      - 'scripts/build-docs-site.sh'
      - 'scripts/docs*'
      - 'scripts/test_docs*'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & deploy MkDocs site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MkDocs Material
        run: pip install 'mkdocs==1.6.*' 'mkdocs-material==9.5.*' 'pymdown-extensions==10.*'
      - name: Test documentation gates
        run: python3 -m unittest discover -s scripts -p 'test_docs*.py' -v
      - name: Validate translations and build all languages
        run: bash scripts/build-docs-site.sh
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
