# Phase 4 matrix of the non-normative dcp-jcs-v2 canonicalization candidate
# (tests/interop/candidate/phase4): five producers (TypeScript, Python, Go, Rust, WASM) sign candidate
# bundles with their experimental opt-in APIs, every consumer verifies every output and 16 byte-level
# negatives of each, and the runner refuses anything short of the 975 expected results. It also runs the
# runner's controls and the cost measurement (gate 10). It publishes nothing: no packages, no secrets, no
# artifacts; the run directory, with its synthetic keys, stays in the runner's temporary directory.

name: Canonicalization candidate matrix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/canonicalization-candidate-matrix.yml'
      - 'sdks/**'
      - 'tests/interop/candidate/**'
      - 'docs/proposals/canonicalization-candidate/README.md'
  pull_request:
    paths:
      - '.github/workflows/canonicalization-candidate-matrix.yml'
      - 'sdks/**'
      - 'tests/interop/candidate/**'
      - 'docs/proposals/canonicalization-candidate/README.md'
  workflow_dispatch:
    inputs:
      deadline:
        description: 'Deadline of the matrix run, in seconds'
        required: false
        default: '1200'

permissions:
  contents: read

# A newer run of the same pull request cancels the older one; runs on main never cancel each other.
concurrency:
  group: canonicalization-candidate-matrix-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    name: Producers x consumers (5 x 5)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DCP_PHASE4_DEADLINE: ${{ inputs.deadline || '1200' }}
      DCP_PHASE4_PYTHON: python
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version-file: sdks/go/go.mod

      - uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # The builds are their own steps, timed apart from the runs.
      - name: Build the TypeScript SDK
        working-directory: sdks/typescript
        run: |
          npm ci
          npm run build

      - name: Build the WASM package
        working-directory: sdks/wasm
        run: |
          npm run build:wasm
          npm ci
          npm run build:ts

      - name: Install the Python SDK
        run: pip install -e sdks/python

      - name: New output directory
        run: |
          node --version && python --version && go version && cargo --version
          phase4_out="$(mktemp -d "$RUNNER_TEMP/candidate-phase4.XXXXXX")"
          printf 'PHASE4_OUT=%s\n' "$phase4_out" >> "$GITHUB_ENV"

      - name: Runner controls
        run: node tests/interop/candidate/phase4/run.mjs --self-test

      # Exit 0 only with every one of the 975 results as expected, every step, fresh outputs, equal
      # producers and the deadline met.
      - name: Run the matrix
        run: node tests/interop/candidate/phase4/run.mjs --out "$PHASE4_OUT" --deadline "$DCP_PHASE4_DEADLINE"

      # One equivalent pair per platform, 20 samples after 3 warm-ups, at most 60 s each. Shared runners
      # are noisy: the numbers are a record, not a threshold.
      - name: Measure the cost
        run: node tests/interop/candidate/phase4/run.mjs --cost --out "$PHASE4_OUT"
