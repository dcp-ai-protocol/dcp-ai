# DCP-AI Continuous Integration
# Runs conformance tests and bundle verification on every push/PR.

name: DCP-AI CI

on:
  push:
    branches: [main]
  # Any base branch, so stacked PRs get CI before they are retargeted to main.
  pull_request:

# Least-privilege default. Jobs can override with a narrower or wider scope
# as needed (e.g. codecov/codecov-action@v4 does not require any write perms).
permissions:
  contents: read

jobs:
  # Detect which areas changed so per-language suites can skip when untouched.
  # Conformance always runs — it's the wire-format invariant check that should
  # catch any protocol-level regression, regardless of which SDK was edited.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      python: ${{ steps.filter.outputs.python }}
      go: ${{ steps.filter.outputs.go }}
      rust: ${{ steps.filter.outputs.rust }}
      wasm: ${{ steps.filter.outputs.wasm }}
      integrations: ${{ steps.filter.outputs.integrations }}
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            typescript:
              - 'docs/proposals/canonicalization-candidate/*.json'
              - 'sdks/typescript/**'
              - 'schemas/**'
              - 'spec/**'
              - 'tests/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            python:
              - 'docs/proposals/canonicalization-candidate/*.json'
              - 'sdks/python/**'
              - 'schemas/**'
              - 'spec/**'
              - 'tests/**'
              - '.github/workflows/ci.yml'
            go:
              - 'docs/proposals/canonicalization-candidate/*.json'
              - 'sdks/go/**'
              - 'schemas/**'
              - 'spec/**'
              - 'tests/**'
              - '.github/workflows/ci.yml'
            rust:
              - 'docs/proposals/canonicalization-candidate/*.json'
              - 'sdks/rust/**'
              - 'sdks/wasm/**'
              - 'schemas/**'
              - 'spec/**'
              - 'tests/**'
              - '.github/workflows/ci.yml'
            wasm:
              - 'docs/proposals/canonicalization-candidate/*.json'
              - 'sdks/wasm/**'
              - 'sdks/rust/**'
              - 'schemas/**'
              - 'spec/**'
              - 'tests/**'
              - '.github/workflows/ci.yml'
            integrations:
              - 'integrations/anthropic-mcp/**'
              - 'integrations/express/**'
              - 'integrations/google-a2a/**'
              - 'integrations/openclaw/**'
              - 'sdks/typescript/**'
              - 'tests/interop/v2/**'
              - 'tests/conformance/examples/**'
              - '.github/workflows/ci.yml'
            cli:
              - 'cli/**'
              - 'sdks/typescript/**'
              - 'schemas/**'
              - 'tests/**'
              - '.github/workflows/ci.yml'

  conformance:
    name: Conformance Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # The root depends on the workspace SDK until @dcp-ai/sdk 2.2.0 is on npm
      # (package.json, .npmrc): build it before installing the root.
      - name: Build the workspace SDK
        working-directory: sdks/typescript
        run: |
          npm install
          npm run build

      - name: Install dependencies
        run: npm install

      - name: Run conformance tests (V1 + V2)
        run: npm run conformance

      # Ed25519 S < L (RFC 8032 §5.1.7) in the reference verifier (tools/crypto.js, lib/verify.js,
      # the transparency-log gossip) and in the playground's verifyDetached.
      - name: Ed25519 S range regressions (reference and playground)
        run: node --test tools/crypto-s-range.test.mjs tools/playground-s-range.test.mjs

      - name: Generate V2 examples
        run: npm run examples:generate:v2

      - name: Verify example signed bundle (V1)
        run: |
          if [ -f tests/conformance/examples/citizenship_bundle.signed.json ] && [ -f keys/public_key.txt ]; then
            node bin/dcp.js verify-bundle tests/conformance/examples/citizenship_bundle.signed.json keys/public_key.txt
          else
            echo "Skipping V1 bundle verification (missing test files)"
          fi

      - name: Verify V2 signed bundle
        run: node bin/dcp.js verify-bundle --policy hybrid_required tests/conformance/examples/signed_bundle_v2.json

      - name: Server and service tests
        run: >-
          node --test server/index.test.js services/revocation/index.test.js bin/dcp.test.js
          services/anchor/index.test.js services/transparency-log/index.test.js tests/helpers.test.js

      - name: Check protocol integrity
        run: node bin/dcp.js integrity

  typescript-sdk:
    name: TypeScript SDK
    needs: changes
    if: ${{ needs.changes.outputs.typescript == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test

      - name: Code coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./sdks/typescript/coverage/lcov.info
          flags: sdk-typescript
          fail_ci_if_error: false
          disable_search: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The npm integrations pin their own lockfiles, so dependency bumps there need their own test
  # run. anthropic-mcp and google-a2a pull @dcp-ai/sdk from the registry; express and openclaw
  # depend on the workspace SDK (file:../../sdks/typescript) until @dcp-ai/sdk 2.2.0 is on npm,
  # so it is built before their install.
  integrations:
    name: Integration (${{ matrix.integration }})
    needs: changes
    if: ${{ needs.changes.outputs.integrations == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        integration: [anthropic-mcp, express, google-a2a, openclaw]
    defaults:
      run:
        working-directory: integrations/${{ matrix.integration }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the workspace SDK
        if: ${{ matrix.integration == 'express' || matrix.integration == 'openclaw' }}
        working-directory: sdks/typescript
        run: npm install && npm run build

      - name: Install dependencies
        run: npm ci

      # The build type-checks src/ through its declaration output; `npm run lint` would also
      # type-check the tests, which openclaw's do not pass yet.
      - name: Build
        run: npm run build --if-present

      - name: Run tests
        run: npx vitest run

  # @dcp-ai/cli runs its own tests against the workspace SDK it needs (2.2.0, not on npm yet). The
  # SDK is built and installed into cli/ as a copy (--install-links), with the CLI's other
  # dependencies, without writing a lockfile or package.json and without install scripts; the root
  # is not installed, so nothing resolves through the root node_modules.
  cli:
    name: CLI (Node ${{ matrix.node-version }})
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build the workspace SDK
        working-directory: sdks/typescript
        run: |
          npm install
          npm run build

      - name: Install the CLI with the workspace SDK
        run: npm install --no-save --package-lock=false --ignore-scripts --install-links ../sdks/typescript

      - name: Check the CLI resolves the workspace SDK, copied
        run: |
          test ! -L node_modules/@dcp-ai/sdk
          test ! -e ../node_modules
          diff -r ../sdks/typescript/dist node_modules/@dcp-ai/sdk/dist
          node -e "const v = require('./node_modules/@dcp-ai/sdk/package.json').version; if (v !== require('../sdks/typescript/package.json').version) throw new Error('SDK ' + v)"
          git diff --exit-code -- package.json
          test ! -e package-lock.json

      # Both suites: verify-s-range (V1, the Ed25519 S range, exit codes) and verify-v2-normative
      # (the normative V2 verifier, the pre-normative envelope, the key pin, the packaged files).
      - name: Run the CLI tests
        run: npm test

      # Each suite inverts one positive case: the run must fail on exactly those, on assertions.
      - name: Negative control
        run: npm run test:negative-control

      - name: Check the packed files
        run: |
          npm pack --dry-run --json --ignore-scripts --offline > "$RUNNER_TEMP/pack.json"
          node -e "
            const files = require(process.env.RUNNER_TEMP + '/pack.json')[0].files.map((f) => f.path);
            const need = ['bin/dcp-ai.js', 'lib/verify-v2.js', 'lib/schemas/v2/signed_bundle.schema.json'];
            const missing = need.filter((f) => !files.includes(f));
            const tests = files.filter((f) => f.startsWith('__tests__/'));
            const schemas = files.filter((f) => f.startsWith('lib/schemas/v2/'));
            if (missing.length || tests.length || schemas.length !== 11) throw new Error(JSON.stringify({ missing, tests, schemas }));
            console.log(files.length + ' files packed');
          "

  python-sdk:
    name: Python SDK
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]" pytest-cov coverage

      - name: Run tests with coverage
        run: pytest -v --cov=dcp_ai --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./sdks/python/coverage.xml
          flags: sdk-python
          fail_ci_if_error: false
          disable_search: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  go-sdk:
    name: Go SDK
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: sdks/go/go.mod

      - name: Build
        run: go build ./...

      - name: Test with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./sdks/go/coverage.out
          flags: sdk-go
          fail_ci_if_error: false
          disable_search: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  rust-sdk:
    name: Rust SDK
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Build
        run: cargo build

      - name: Build (otlp feature)
        run: cargo build --features otlp

      - name: Test with coverage
        run: cargo llvm-cov --lcov --output-path lcov.info

      - name: Test (all features)
        run: cargo test --all-features

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./sdks/rust/lcov.info
          flags: sdk-rust
          fail_ci_if_error: false
          disable_search: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Build WASM
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --target wasm32-unknown-unknown --features wasm

      # tests/wasm_bindings.rs only compiles for wasm32; build it so it cannot rot.
      - name: Build WASM tests
        run: cargo test --target wasm32-unknown-unknown --features wasm --no-run

  wasm-sdk:
    name: WASM SDK
    needs: changes
    if: ${{ needs.changes.outputs.wasm == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/wasm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build WASM
        run: npm run build:wasm

      - name: Build TypeScript
        run: |
          npm install
          npm run build:ts

      # Runs verifyBundle over tests/interop/v2/bundle_vectors.json in Node, so the
      # wasm verifier runs; the Rust job only compiles the wasm32 tests.
      - name: Verify the bundle vectors through the wasm build
        run: npm test
