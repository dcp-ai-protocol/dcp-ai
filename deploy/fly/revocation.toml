# Fly.io deployment for the DCP-AI revocation registry.
# Accepts revocation records from operators and serves them at
# /.well-known/dcp-revocations.json for verifiers to consult.
#
# Usage:
#   fly launch --config revocation.toml --no-deploy
#   fly deploy --config revocation.toml
#
#   fly secrets set OPERATOR_TOKEN=...   # needed to register new agent_ids
#
# State (registered keys, revocations) is in memory: a stopped machine forgets
# it, so one machine stays up. Restarts and deploys still wipe it unless the
# state goes on a volume:
#   fly volumes create revocation_data --size 1
#   and add:  [mounts]  source = "revocation_data"  destination = "/data"
#   and set:  REVOCATION_STATE_PATH = "/data/revocation-state.jsonl" under [env]

app = "dcp-ai-revocation"
primary_region = "iad"

[build]
  image = "ghcr.io/dcp-ai-protocol/dcp-ai/revocation:latest"

[env]
  PORT = "3003"
  DCP_VERSION = "2.0"
  TRUST_PROXY = "true"   # Fly's proxy appends the client IP to X-Forwarded-For

[http_service]
  internal_port = 3003
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
